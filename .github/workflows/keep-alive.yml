# Keep-alive semanal del proyecto Supabase (plan Free).
# Supabase pausa los proyectos Free tras ~7 días sin actividad. Este job llama una vez por semana a la acción
# pública `health` de la Edge Function `api`, que además hace una consulta mínima a Postgres.
# Costo: ~4-5 invocaciones por mes. Ver docs/deploy.md.
#
# Ojo: GitHub desactiva los workflows programados de un repo público tras 60 días sin actividad en el repo.
# Si eso pasa, GitHub avisa por mail: reactivarlo desde la pestaña Actions.
name: Keep-alive Supabase

on:
  schedule:
    - cron: '17 12 * * 1,4' # lunes y jueves 12:17 UTC (09:17 en Argentina): margen ante una corrida perdida
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a api/health
        run: |
          set -euo pipefail
          for intento in 1 2 3; do
            respuesta=$(curl -sS --max-time 30 -X POST \
              -H 'Content-Type: application/json' \
              -d '{"accion":"health"}' \
              https://ekfwdrsehhmrqxxlefyx.supabase.co/functions/v1/api || true)
            echo "Intento $intento: $respuesta"
            if echo "$respuesta" | grep -q '"db":"ok"'; then exit 0; fi
            sleep 20
          done
          echo "::error::La API de MedMar no respondió OK. Revisá si el proyecto Supabase está pausado."
          exit 1
